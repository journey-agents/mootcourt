site_name: Moot Court
site_description: Argue the next experiment from precedent before the trial.
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  superpowers/
hooks:
  - scripts/mkdocs_hooks.py
copyright: A precedent forecast is an argument about what to expect, not a replacement for running the experiment.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: default

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorials:
      - 1. Your first card: tutorials/01-first-card.md
      - 2. Your own archive: tutorials/02-your-own-archive.md
      - 3. Reproduce the Upworthy study: tutorials/03-reproduce-upworthy.md
      - 4. The weekly loop: tutorials/04-weekly-loop.md
      - 5. Serve over HTTP and MCP: tutorials/05-serve-http-and-mcp.md
      - 6. A simulation agent: tutorials/06-simulation-agent.md
  - Concepts: concepts.md
  - How to:
      - Bring a ledger: howto/bring-a-ledger.md
      - Attach a simulation agent: simulators.md
      - Run the benchmark: benchmark.md
      - Operate the weekly loop: operations.md
      - Serve the card and use the MCP tool: howto/serve-and-mcp.md
      - Read the scale results: scale.md
  - Reference:
      - Command guide: commands.md
      - Command line: reference/cli.md
      - Configuration: reference/config.md
      - Python API: reference/api.md
      - Ledger format: ledger-format.md
  - Results: results.md
  - Method: method.md
  - Landscape: landscape.md
  - Limitations: limitations.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Release: release.md
