name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job downloads data, sets a data root or calls a network service. The test suite blocks sockets itself
# (tests/conftest.py), and tests that need real data skip cleanly when the raw data folder is absent.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      # pyproject's addopts already quiets pytest once; a second quiet flag here hid the count line in the job log (round 01, R4)
      - run: uv run pytest -p no:cacheprovider
        env:
          MOOTCOURT_DATA_ROOT: ""
      # A per-platform score report (round 01, R5 minor 8): a fixed-seed backtest of the bundled sample ledger with P0, P1 and P2, written by
      # scripts/ci_score_report.py and kept as the artifact score-report-<python>; the paper names the artifact, not a number.
      - name: Score report on the bundled sample ledger
        run: uv run python scripts/ci_score_report.py --out score-report-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: score-report-${{ matrix.python-version }}
          path: score-report-${{ matrix.python-version }}.json

  writing-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run pytest tests/test_writing_rules.py -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Install the wheel in a clean environment and run the command line
        run: |
          uv venv --python 3.12 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/moot --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra docs --python 3.12
      - run: uv run mkdocs build --strict

  # Builds the image and runs the doctor in it. The image is verified here, on a hosted runner with a Docker daemon: the machine the
  # release was prepared on had none (docs/release.md). The doctor answers 0 (healthy) or 1 (warnings, as on an empty data root); a crash also exits 1, so the step reads the output too.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image
        run: docker build -t mootcourt:ci .
      - name: Run moot --version inside the image
        run: docker run --rm mootcourt:ci moot --version
      - name: Run moot doctor inside the image
        run: |
          data="$RUNNER_TEMP/mootcourt-data"
          mkdir -p "$data"
          chmod a+rwx "$data"
          code=0
          docker run --rm -v "$data:/data" mootcourt:ci moot doctor > "$RUNNER_TEMP/doctor.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/doctor.txt"
          bash scripts/check_doctor_output.sh "$code" "$RUNNER_TEMP/doctor.txt"
