[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mootcourt"
version = "1.0.0"
description = "Argue the next experiment from precedent before the trial: a ledger of concluded tests, a predictor ladder, abstention and scored cards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yingjie Li", email = "liyingjie@journey-ai.net" }]
maintainers = [{ name = "Yingjie Li", email = "liyingjie@journey-ai.net" }]
keywords = ["experimentation", "a/b testing", "forecasting", "bayesian", "calibration", "abstention", "precedent", "decision support"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.2",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/journey-agents/mootcourt"
Repository = "https://github.com/journey-agents/mootcourt"
Issues = "https://github.com/journey-agents/mootcourt/issues"
Changelog = "https://github.com/journey-agents/mootcourt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "httpx>=0.27",
]
simulators = [
  "httpx>=0.27",            # a client for agents served over HTTP; the adapters themselves need nothing beyond the standard library
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

# Project URLs are added once the repository location is fixed; see docs/release.md.

[project.scripts]
moot = "mootcourt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mootcourt"]

# The source distribution carries the package, its examples and its tests; the paper's run folders, the documentation, the scripts
# and the repository files stay in the repository (round 01, R4: the sdist held 48 MB of paper/data).
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running benchmark or large fit",
  "realdata: needs data/raw (skipped when absent)",
]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B007", "B009"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
