# Repository-level configuration.
#
# Storage: uncomment to move every heavy folder to another volume (the environment variable MOOTCOURT_DATA_ROOT wins).
# [storage]
# data_root = "/path/to/a/large/volume/mootcourt-data"

# Response simulators. `moot simulators list` shows what is registered; `moot simulators run` runs one provider.
[simulators.example_stdio]
adapter = "stdio"
command = ["python3", "examples/simulators/stdio_agent.py"]
version = "0.1"
knowledge_cutoff = "1970-01-01"   # a rule of thumb has no training data; declare a date before every origin
cost_model = "free"
description = "Example stdio agent from examples/simulators; scores headline traits, no model call."
time_cap_s = 20
